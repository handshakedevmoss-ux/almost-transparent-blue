<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Almost Transparent Blue - Liquid Glass Ambient</title>
  <style>
    /* ==========================================
       1. Design Tokens & Reset (Liquid Glass UI)
       ========================================== */
    :root {
      /* ディープブルーを基調とした背景色 */
      --bg-dark: #030811;
      /* ガラスマテリアル */
      --glass-surface: rgba(16, 28, 48, 0.45);
      --glass-highlight: rgba(255, 255, 255, 0.25);
      --glass-border: rgba(255, 255, 255, 0.1);
      /* テキスト */
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      position: relative;
    }

    /* ==========================================
       光の光源レイヤー（奥側 / Ambient Chill）
       ========================================== */
    .ambient-backdrop {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      z-index: 0;
      filter: blur(50px);
      -webkit-filter: blur(50px);
      transition: background 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }

    /* ==========================================
       Liquid Glassの波形レイヤー（手前側）
       ========================================== */
    .liquid-ribbons {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glass-wave {
      position: absolute;
      /* ディープブルーのガラス素材 */
      background: linear-gradient(135deg, rgba(30, 70, 110, 0.25), rgba(5, 15, 30, 0.7));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      /* ガラスのエッジ反射（左と上を強く） */
      border-top: 1.5px solid rgba(255, 255, 255, 0.25);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      /* 深い影と内側の反射 */
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.6),
        inset 0 4px 15px rgba(255, 255, 255, 0.05);
    }

    /* 巨大な液状ガラスのうねり */
    .wave1 {
      top: -15%; left: -20%;
      width: 150vw; height: 65vh;
      border-radius: 40% 60% 55% 45% / 50% 50% 50% 50%;
      transform: rotate(-12deg);
    }
    .wave2 {
      bottom: -20%; right: -25%;
      width: 160vw; height: 75vh;
      border-radius: 45% 55% 40% 60% / 40% 60% 40% 60%;
      transform: rotate(18deg);
      background: linear-gradient(135deg, rgba(20, 50, 90, 0.2), rgba(2, 8, 20, 0.8));
    }

    /* ==========================================
       メインUIコンテナ
       ========================================== */
    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* プレーヤーカード（Liquid Glassデザイン） */
    .player-card {
      width: 100%;
      background: linear-gradient(145deg, rgba(30, 55, 90, 0.35), rgba(10, 18, 30, 0.65));
      border-radius: 42px;
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      backdrop-filter: blur(35px) saturate(120%);
      -webkit-backdrop-filter: blur(35px) saturate(120%);
      /* ガラスエッジとシャドウ */
      border-top: 1px solid var(--glass-highlight);
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      box-shadow: 
        0 30px 60px -10px rgba(0, 0, 0, 0.8),
        inset 0 0 20px rgba(255, 255, 255, 0.03);
    }

    .card-top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 6px;
    }
    .more-dots {
      display: flex;
      gap: 5px;
      cursor: pointer;
      opacity: 0.7;
    }
    .more-dots span {
      width: 4.5px;
      height: 4.5px;
      background: #fff;
      border-radius: 50%;
    }

    /* アートワーク（Liquid Glassフレーム） */
    .artwork-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      /* フレームのエッジハイライト */
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        inset 0 2px 6px rgba(255, 255, 255, 0.2);
      cursor: crosshair;
      touch-action: none;
    }

    #colorCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 波形バッジ（ガラスピル） */
    .waveform-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 3.5px;
      background: rgba(20, 35, 60, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 9px 13px;
      border-radius: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      z-index: 30;
    }
    .waveform-badge:active { transform: scale(0.92); background: rgba(20, 35, 60, 0.7); }

    .wave-bar {
      width: 2.5px;
      height: 12px;
      background: #fff;
      border-radius: 2px;
      opacity: 0.4;
      transition: opacity 0.3s ease, height 0.3s ease;
    }

    .playing .wave-bar {
      opacity: 1;
      animation: wave 1s ease-in-out infinite alternate;
    }
    .playing .wave-bar:nth-child(2) { height: 16px; animation-delay: 0.2s; animation-duration: 0.8s; }
    .playing .wave-bar:nth-child(3) { height: 8px; animation-delay: 0.4s; animation-duration: 1.1s; }
    .playing .wave-bar:nth-child(4) { height: 14px; animation-delay: 0.1s; animation-duration: 0.9s; }
    @keyframes wave { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1.1); } }

    .reticle {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(2px);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), inset 0 0 4px rgba(255, 255, 255, 0.5);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out;
    }

    /* テキスト（ガラスに刻まれたような透過感） */
    .metadata-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }
    .episode-title {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255,255,255,0.1);
    }
    .show-title {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--text-sub);
    }

    /* コントロール群 */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 8px;
    }
    .ctrl-icon {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      opacity: 0.6;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
    }
    .ctrl-icon:active { transform: scale(0.85); opacity: 1; }

    /* メインボタン（Liquid Glassサークル） */
    .main-play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: none;
      border-top: 1px solid rgba(255,255,255,0.4);
      border-left: 1px solid rgba(255,255,255,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.02);
      border-right: 1px solid rgba(255,255,255,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 
        0 15px 30px rgba(0, 0, 0, 0.4),
        inset 0 2px 10px rgba(255, 255, 255, 0.1);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
    }
    .main-play-btn:active {
      transform: scale(0.92);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.1);
    }
    .main-play-btn svg {
      width: 32px;
      height: 32px;
      fill: #fff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* 履歴ドロワー（Liquid Glass） */
    .history-drawer {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 4px;
    }
    .history-header {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      padding-left: 4px;
    }
    .history-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .history-track::-webkit-scrollbar { display: none; }
    
    .history-card {
      flex: 0 0 52px;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      background: rgba(20, 30, 50, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }
    .history-card:active { transform: scale(0.9) translateY(2px); }
    .history-card canvas { width: 100%; height: 100%; display: block; }

    /* トースト */
    .toast {
      position: fixed;
      top: 30px;
      background: rgba(30, 45, 70, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <!-- 光源となる大気グラデーション（Ambient Chill） -->
  <div class="ambient-backdrop" id="backdrop"></div>

  <!-- ディープブルーのLiquid Glass（リボン）レイヤー -->
  <div class="liquid-ribbons">
    <div class="glass-wave wave1"></div>
    <div class="glass-wave wave2"></div>
  </div>

  <div class="toast" id="toast">壁紙を生成しました</div>

  <div class="app-shell">
    <div class="player-card">
      <div class="card-top-bar">
        <div class="more-dots" id="timeCycleBtn" title="時間帯を変更">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="artwork-container" id="artworkBox">
        <canvas id="colorCanvas"></canvas>
        
        <div class="waveform-badge" id="ambientToggleBtn" title="アンビエント環境音を再生/ミュート">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

        <div class="reticle" id="reticle"></div>
      </div>

      <div class="metadata-block">
        <div class="episode-title" id="phaseTitle">TWILIGHT DUSK</div>
        <div class="show-title" id="hexReadout">HEX: #2C5F8A · 1080 × 2340 px</div>
      </div>

      <div class="controls-row">
        <button class="ctrl-icon" id="prevPhaseBtn" title="前の時間帯">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <button class="main-play-btn" id="generateBtn" title="壁紙を生成してダウンロード">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>

        <button class="ctrl-icon" id="nextPhaseBtn" title="次の時間帯">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="history-drawer">
      <div class="history-header">Recent Drops</div>
      <div class="history-track" id="historyTrack"></div>
    </div>
  </div>

  <script>
    /* ==============================================================
       添付画像のカラーに基づいた再構成フェーズ定義
       ============================================================== */
    const PHASES = [
      {
        id: 'cave-dawn',
        name: 'CAVE DAWN',
        topColor: '#2C4B61',
        midColor: '#1E3141',
        bottomColor: '#101A24',
        accentColor: '#FFFACD',
        backdrop: `
          radial-gradient(circle at center, rgba(255, 250, 205, 0.4) 0%, transparent 70%),
          linear-gradient(165deg, rgba(255, 250, 205, 0.2) 0%, #101A24 100%)
        `,
        soundType: 'highPass',
        soundVol: 0.18
      },
      {
        id: 'verve-ignite',
        name: 'VERVE IGNITE',
        topColor: '#FF4500',
        midColor: '#FFA500',
        bottomColor: '#1E3141',
        accentColor: '#FFD700',
        backdrop: `
          radial-gradient(circle at center, rgba(255, 215, 0, 0.5) 0%, transparent 70%),
          linear-gradient(165deg, rgba(255, 215, 0, 0.2) 0%, #1E3141 100%)
        `,
        soundType: 'bandPass',
        soundVol: 0.22
      },
      {
        id: 'core-light',
        name: 'CORE LIGHT',
        topColor: '#FFFACD',
        midColor: '#408C99',
        bottomColor: '#1E3141',
        accentColor: '#FFFFFF',
        backdrop: `
          radial-gradient(circle at center, rgba(255, 255, 255, 0.6) 0%, transparent 70%),
          linear-gradient(165deg, rgba(255, 255, 255, 0.2) 0%, #1E3141 100%)
        `,
        soundType: 'lowPass',
        soundVol: 0.20
      },
      {
        id: 'abyssal-deep',
        name: 'ABYSSAL DEEP',
        topColor: '#1E3141',
        midColor: '#101A24',
        bottomColor: '#020508',
        accentColor: '#2C4B61',
        backdrop: `
          radial-gradient(circle at center, rgba(44, 75, 97, 0.3) 0%, transparent 70%),
          linear-gradient(165deg, rgba(44, 75, 97, 0.1) 0%, #020508 100%)
        `,
        soundType: 'pureNoise',
        soundVol: 0.15
      }
    ];

    let currentPhaseIndex = 1; // VERVE IGNITEを初期フェーズに
    let selectedColor = '#FFA500'; // VERVE IGNITEの中間色を初期色に
    let historyList = [];

    const canvas = document.getElementById('colorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const artworkBox = document.getElementById('artworkBox');
    const reticle = document.getElementById('reticle');
    const backdrop = document.getElementById('backdrop');
    const phaseTitle = document.getElementById('phaseTitle');
    const hexReadout = document.getElementById('hexReadout');
    const generateBtn = document.getElementById('generateBtn');
    const prevPhaseBtn = document.getElementById('prevPhaseBtn');
    const nextPhaseBtn = document.getElementById('nextPhaseBtn');
    const timeCycleBtn = document.getElementById('timeCycleBtn');
    const historyTrack = document.getElementById('historyTrack');
    const toast = document.getElementById('toast');
    const ambientToggleBtn = document.getElementById('ambientToggleBtn');

    function setupCanvas() {
      const rect = artworkBox.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      drawAtmosphere();
      updatePointer(rect.width * 0.5, rect.height * 0.5);
    }

    function drawAtmosphere() {
      const phase = PHASES[currentPhaseIndex];
      const w = canvas.width;
      const h = canvas.height;

      const baseGrad = ctx.createLinearGradient(0, 0, 0, h);
      baseGrad.addColorStop(0, phase.topColor);
      baseGrad.addColorStop(0.45, phase.midColor);
      baseGrad.addColorStop(1, phase.bottomColor);
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = 'screen';
      const glowGrad = ctx.createRadialGradient(w * 0.3, 0, 0, w * 0.3, 0, w * 0.85);
      glowGrad.addColorStop(0, phase.accentColor + '88'); 
      glowGrad.addColorStop(0.5, phase.accentColor + '22'); 
      glowGrad.addColorStop(1, phase.accentColor + '00');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, w, h);
      
      ctx.globalCompositeOperation = 'source-over';
    }

    function switchPhase(direction) {
      currentPhaseIndex = (currentPhaseIndex + direction + PHASES.length) % PHASES.length;
      const phase = PHASES[currentPhaseIndex];
      
      backdrop.style.background = phase.backdrop;
      phaseTitle.textContent = phase.name;
      drawAtmosphere();

      const rect = artworkBox.getBoundingClientRect();
      const rx = parseFloat(reticle.style.left) || rect.width / 2;
      const ry = parseFloat(reticle.style.top) || rect.height / 2;
      pickColorAt(rx, ry);

      updateAmbientSound();
    }

    function pickColorAt(clientX, clientY) {
      const rect = artworkBox.getBoundingClientRect();
      const x = Math.max(0, Math.min(clientX, rect.width));
      const y = Math.max(0, Math.min(clientY, rect.height));

      const dpr = window.devicePixelRatio || 1;
      const pixel = ctx.getImageData(x * dpr, y * dpr, 1, 1).data;
      const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);

      selectedColor = hex;
      updatePointer(x, y);

      const luminance = (pixel[0] * 0.299 + pixel[1] * 0.587 + pixel[2] * 0.114) / 255;
      const clarity = (luminance * 100).toFixed(1);

      hexReadout.textContent = `HEX: ${hex.toUpperCase()} · CLARITY: ${clarity}%`;
    }

    function updatePointer(x, y) {
      reticle.style.left = `${x}px`;
      reticle.style.top = `${y}px`;
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    let isInteracting = false;
    function handleTouch(e) {
      if (e.target === ambientToggleBtn || ambientToggleBtn.contains(e.target)) return;
      const rect = artworkBox.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      pickColorAt(touch.clientX - rect.left, touch.clientY - rect.top);
    }

    artworkBox.addEventListener('pointerdown', (e) => {
      if (e.target === ambientToggleBtn || ambientToggleBtn.contains(e.target)) return;
      isInteracting = true;
      handleTouch(e);
    });
    window.addEventListener('pointermove', (e) => {
      if (isInteracting) handleTouch(e);
    });
    window.addEventListener('pointerup', () => { isInteracting = false; });
    window.addEventListener('pointercancel', () => { isInteracting = false; });

    function generateWallpaper() {
      const offCanvas = document.createElement('canvas');
      const w = 1080;
      const h = 2340;
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');

      const baseGrad = offCtx.createLinearGradient(0, 0, 0, h);
      baseGrad.addColorStop(0, selectedColor);
      baseGrad.addColorStop(1, '#030811');
      offCtx.fillStyle = baseGrad;
      offCtx.fillRect(0, 0, w, h);

      function drawSoftGlassFold(pathFunc, shadowParams, fillParams) {
        offCtx.save();
        offCtx.beginPath();
        pathFunc(offCtx, w, h);
        offCtx.closePath();

        offCtx.shadowColor = shadowParams.color;
        offCtx.shadowBlur = shadowParams.blur;
        offCtx.shadowOffsetX = shadowParams.offsetX;
        offCtx.shadowOffsetY = shadowParams.offsetY;

        const fillGrad = offCtx.createLinearGradient(0, 0, w, h);
        fillParams.stops.forEach(s => fillGrad.addColorStop(s.offset, s.color));
        offCtx.fillStyle = fillGrad;
        offCtx.fill();

        offCtx.restore();
      }

      drawSoftGlassFold(
        (ctx, w, h) => {
          ctx.moveTo(0, h * 0.1);
          ctx.bezierCurveTo(w * 0.3, h * 0.05, w * 0.6, h * 0.2, w, h * 0.15);
          ctx.lineTo(w, 0);
          ctx.lineTo(0, 0);
        },
        { color: 'rgba(255, 255, 255, 0.1)', blur: 50, offsetX: 0, offsetY: 10 },
        {
          stops: [
            { offset: 0, color: 'rgba(255, 255, 255, 0.05)' },
            { offset: 1, color: 'rgba(255, 255, 255, 0)' }
          ]
        }
      );

      drawSoftGlassFold(
        (ctx, w, h) => {
          ctx.moveTo(0, h * 0.85);
          ctx.bezierCurveTo(w * 0.4, h * 0.9, w * 0.7, h * 0.8, w, h * 0.88);
          ctx.lineTo(w, h);
          ctx.lineTo(0, h);
        },
        { color: 'rgba(0, 0, 0, 0.5)', blur: 60, offsetX: 0, offsetY: -10 },
        {
          stops: [
            { offset: 0, color: 'rgba(16, 28, 48, 0.4)' },
            { offset: 1, color: 'rgba(5, 15, 30, 0.8)' }
          ]
        }
      );

      drawSoftGlassFold(
        (ctx, w, h) => {
          ctx.moveTo(w * 0.2, h);
          ctx.bezierCurveTo(w * 0.1, h * 0.7, w * 0.4, h * 0.4, w * 0.3, 0);
          ctx.lineTo(0, 0);
          ctx.lineTo(0, h);
        },
        { color: 'rgba(255, 255, 255, 0.05)', blur: 40, offsetX: 10, offsetY: 0 },
        {
          stops: [
            { offset: 0, color: selectedColor + 'aa' },
            { offset: 1, color: 'rgba(255, 255, 255, 0.01)' }
          ]
        }
      );

      drawSoftGlassFold(
        (ctx, w, h) => {
          ctx.moveTo(w * 0.8, 0);
          ctx.bezierCurveTo(w * 0.9, h * 0.3, w * 0.6, h * 0.6, w * 0.7, h);
          ctx.lineTo(w, h);
          ctx.lineTo(w, 0);
        },
        { color: 'rgba(0, 0, 0, 0.4)', blur: 50, offsetX: -10, offsetY: 0 },
        {
          stops: [
            { offset: 0, color: 'rgba(16, 28, 48, 0.3)' },
            { offset: 1, color: selectedColor + 'aa' }
          ]
        }
      );

      const link = document.createElement('a');
      link.download = `almost-transparent-blue-${Date.now()}.png`;
      link.href = offCanvas.toDataURL('image/png');
      link.click();

      pushHistory(selectedColor);
      showToast('壁紙をダウンロードしました');
    }

    function pushHistory(color) {
      historyList.unshift(color);
      if (historyList.length > 10) historyList.pop();
      try {
        localStorage.setItem('blue_history', JSON.stringify(historyList));
      } catch (e) {}
      renderHistory();
    }

    function renderHistory() {
      historyTrack.innerHTML = '';
      historyList.forEach((col, idx) => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.title = `Saved Drop #${idx + 1}`;

        const c = document.createElement('canvas');
        c.width = 54;
        c.height = 96;
        const cx = c.getContext('2d');
        const g = cx.createLinearGradient(0, 0, 0, 96);
        g.addColorStop(0, col);
        g.addColorStop(1, '#08121C');
        cx.fillStyle = g;
        cx.fillRect(0, 0, 54, 96);

        card.appendChild(c);
        
        card.onclick = () => {
          selectedColor = col;
          hexReadout.textContent = `HEX: ${col.toUpperCase()} (RESTORED)`;
          
          const hex = col.replace('#', '');
          const tr = parseInt(hex.substring(0, 2), 16);
          const tg = parseInt(hex.substring(2, 4), 16);
          const tb = parseInt(hex.substring(4, 6), 16);

          const w = canvas.width;
          const h = canvas.height;
          const imgData = ctx.getImageData(0, 0, w, h).data;
          
          let minDiff = Infinity;
          let bestX = w / 2;
          let bestY = h / 2;
          
          for (let y = 0; y < h; y += 4) {
            for (let x = 0; x < w; x += 4) {
              const i = (y * w + x) * 4;
              const dr = imgData[i] - tr;
              const dg = imgData[i+1] - tg;
              const db = imgData[i+2] - tb;
              const diff = dr * dr + dg * dg + db * db;
              
              if (diff < minDiff) {
                minDiff = diff;
                bestX = x;
                bestY = y;
              }
            }
          }
          
          const dpr = window.devicePixelRatio || 1;
          updatePointer(bestX / dpr, bestY / dpr);
          
          showToast('履歴から色を復元しました');
        };
        
        historyTrack.appendChild(card);
      });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    prevPhaseBtn.addEventListener('click', () => switchPhase(-1));
    nextPhaseBtn.addEventListener('click', () => switchPhase(1));
    timeCycleBtn.addEventListener('click', () => switchPhase(1));
    generateBtn.addEventListener('click', generateWallpaper);

    window.addEventListener('load', () => {
      try {
        const saved = localStorage.getItem('blue_history');
        if (saved) historyList = JSON.parse(saved);
      } catch (e) {}
      if (!historyList.length) {
        historyList = ['#FFA500', '#FFD700', '#2C4B61']; // デフォルト履歴も更新
      }
      renderHistory();
      
      backdrop.style.background = PHASES[currentPhaseIndex].backdrop;
      setupCanvas();
    });

    window.addEventListener('resize', setupCanvas);

    /* ==============================================================
       アンビエント環境音（iOS Safariの自動再生制限を突破する完全同期処理）
       ============================================================== */
    let audioContext = null;
    let whiteNoiseSource = null;
    let filterNode = null;
    let gainNode = null;
    let isPlaying = false;
    let isAudioUnlocked = false; 

    ambientToggleBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
    });

    ambientToggleBtn.addEventListener('touchend', (e) => {
      e.stopPropagation();
      e.preventDefault(); 
      handleAudioToggle();
    }, { passive: false });

    ambientToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleAudioToggle();
    });

    function handleAudioToggle() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
        setupAudioNodes();
      }

      if (!isAudioUnlocked) {
        const osc = audioContext.createOscillator();
        const silentGain = audioContext.createGain();
        silentGain.gain.value = 0;
        osc.connect(silentGain);
        silentGain.connect(audioContext.destination);
        osc.start(0);
        osc.stop(audioContext.currentTime + 0.01);
        isAudioUnlocked = true;
      }

      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      const now = audioContext.currentTime;
      const targetVol = PHASES[currentPhaseIndex].soundVol;

      if (!isPlaying) {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(targetVol, now + 0.1);

        ambientToggleBtn.classList.add('playing');
        isPlaying = true;
        showToast('アンビエント環境音を再生中');
      } else {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(0.0001, now + 0.1);

        ambientToggleBtn.classList.remove('playing');
        isPlaying = false;
        showToast('環境音をミュートしました');
      }
    }

    function setupAudioNodes() {
      const bufferSize = audioContext.sampleRate * 2;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      whiteNoiseSource = audioContext.createBufferSource();
      whiteNoiseSource.buffer = noiseBuffer;
      whiteNoiseSource.loop = true;

      filterNode = audioContext.createBiquadFilter();

      gainNode = audioContext.createGain();
      gainNode.gain.setValueAtTime(0.0001, audioContext.currentTime);

      whiteNoiseSource.connect(filterNode);
      filterNode.connect(gainNode);
      gainNode.connect(audioContext.destination);

      whiteNoiseSource.start(0);
      updateAmbientSound();
    }

    function updateAmbientSound() {
      if (!filterNode || !audioContext) return;
      const phase = PHASES[currentPhaseIndex];
      const now = audioContext.currentTime;

      filterNode.frequency.cancelScheduledValues(now);
      filterNode.Q.cancelScheduledValues(now);

      switch (phase.soundType) {
        case 'highPass':
          filterNode.type = 'highpass';
          filterNode.frequency.setTargetAtTime(1000, now, 0.3);
          filterNode.Q.setTargetAtTime(1, now, 0.3);
          break;
        case 'bandPass':
          filterNode.type = 'bandpass';
          filterNode.frequency.setTargetAtTime(750, now, 0.3);
          filterNode.Q.setTargetAtTime(1.2, now, 0.3);
          break;
        case 'lowPass':
          filterNode.type = 'lowpass';
          filterNode.frequency.setTargetAtTime(450, now, 0.3);
          filterNode.Q.setTargetAtTime(1, now, 0.3);
          break;
        case 'pureNoise':
        default:
          filterNode.type = 'lowpass';
          filterNode.frequency.setTargetAtTime(2500, now, 0.3);
          filterNode.Q.setTargetAtTime(0.7, now, 0.3);
          break;
      }

      if (isPlaying) {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(phase.soundVol, now + 0.2);
      }
    }
  </script>
</body>
