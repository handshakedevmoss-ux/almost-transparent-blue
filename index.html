<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Almost Transparent Blue - Wallpaper & Ambient</title>
  <style>
    /* ==========================================
       1. Design Tokens & Reset
       ========================================== */
    :root {
      --bg-dark: #070a10;
      --card-bg: rgba(14, 18, 26, 0.62);
      --card-inner: #1a1d24;
      --text-main: #f0f3f6;
      --text-sub: #8e95a2;
      --accent-glow: rgba(184, 218, 242, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      position: relative;
    }

    /* ==========================================
       なめらかな大気グラデーション背景
       ========================================== */
    .ambient-backdrop {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      z-index: 0;
      filter: blur(45px);
      -webkit-filter: blur(45px);
      transition: background 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .player-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 36px;
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .card-top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 4px;
    }
    .more-dots {
      display: flex;
      gap: 4px;
      cursor: pointer;
      opacity: 0.6;
    }
    .more-dots span {
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
    }

    .artwork-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      cursor: crosshair;
      touch-action: none;
    }

    #colorCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .waveform-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      z-index: 30;
      pointer-events: auto;
    }
    .waveform-badge:active { transform: scale(0.94); background: rgba(0, 0, 0, 0.65); }

    .wave-bar {
      width: 2.5px;
      height: 12px;
      background: #fff;
      border-radius: 2px;
      opacity: 0.4;
      transition: opacity 0.3s ease, height 0.3s ease;
    }

    .playing .wave-bar {
      opacity: 1;
      animation: wave 1s ease-in-out infinite alternate;
    }
    .playing .wave-bar:nth-child(2) { height: 16px; animation-delay: 0.2s; animation-duration: 0.8s; }
    .playing .wave-bar:nth-child(3) { height: 8px; animation-delay: 0.4s; animation-duration: 1.1s; }
    .playing .wave-bar:nth-child(4) { height: 14px; animation-delay: 0.1s; animation-duration: 0.9s; }
    @keyframes wave { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1.1); } }

    .reticle {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), inset 0 0 4px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out;
    }

    .metadata-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }
    .episode-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.05em;
    }
    .show-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 4px;
    }
    .ctrl-icon {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      opacity: 0.75;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
    }
    .ctrl-icon:active {
      transform: scale(0.9);
      opacity: 1;
    }

    .main-play-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      color: #0b0d11;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, background 0.2s;
    }
    .main-play-btn:active {
      transform: scale(0.94);
      background: #e5e9f0;
    }
    .main-play-btn svg {
      width: 28px;
      height: 28px;
      fill: #0b0d11;
    }

    .history-drawer {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 4px;
    }
    .history-header {
      font-size: 0.78rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .history-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .history-track::-webkit-scrollbar {
      display: none;
    }
    .history-card {
      flex: 0 0 52px;
      aspect-ratio: 9 / 16;
      border-radius: 10px;
      background: #1c2027;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease;
    }
    .history-card:active {
      transform: scale(0.95);
    }
    .history-card canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toast {
      position: fixed;
      top: 24px;
      background: rgba(255, 255, 255, 0.95);
      color: #0b0d11;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(-15px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- なめらかな大気グラデーション背景 -->
  <div class="ambient-backdrop" id="backdrop"></div>

  <div class="toast" id="toast">壁紙をダウンロードしました</div>

  <div class="app-shell">
    <div class="player-card">
      <div class="card-top-bar">
        <div class="more-dots" id="timeCycleBtn" title="時間帯を変更">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="artwork-container" id="artworkBox">
        <canvas id="colorCanvas"></canvas>
        
        <div class="waveform-badge" id="ambientToggleBtn" title="アンビエント環境音を再生/ミュート">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

        <div class="reticle" id="reticle"></div>
      </div>

      <div class="metadata-block">
        <div class="episode-title" id="phaseTitle">TWILIGHT DUSK</div>
        <div class="show-title" id="hexReadout">HEX: #2C5F8A · 1080 × 2340 px</div>
      </div>

      <div class="controls-row">
        <button class="ctrl-icon" id="prevPhaseBtn" title="前の時間帯">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <button class="main-play-btn" id="generateBtn" title="壁紙を生成してダウンロード">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>

        <button class="ctrl-icon" id="nextPhaseBtn" title="次の時間帯">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="history-drawer">
      <div class="history-header">Recent Drops (Max 10)</div>
      <div class="history-track" id="historyTrack"></div>
    </div>
  </div>

  <script>
    /* ==============================================================
       フェーズ定義
       ============================================================== */
    const PHASES = [
      {
        id: 'dawn',
        name: 'DAWN MIST',
        topColor: '#E2EAF2',
        midColor: '#5C8BA6',
        bottomColor: '#1F3A4D',
        accentColor: '#FFFFFF',
        backdrop: `
          radial-gradient(circle at 30% 0%, rgba(255, 255, 255, 0.4) 0%, transparent 60%),
          linear-gradient(165deg, #E2EAF2 0%, #5C8BA6 45%, #1F3A4D 100%)
        `,
        soundType: 'highPass',
        soundVol: 0.18
      },
      {
        id: 'zenith',
        name: 'ZENITH SKY',
        topColor: '#C4E4F7',
        midColor: '#3681B3',
        bottomColor: '#123D59',
        accentColor: '#D8F0FF',
        backdrop: `
          radial-gradient(circle at 30% 0%, rgba(216, 240, 255, 0.45) 0%, transparent 60%),
          linear-gradient(165deg, #C4E4F7 0%, #3681B3 45%, #123D59 100%)
        `,
        soundType: 'bandPass',
        soundVol: 0.22
      },
      {
        id: 'dusk',
        name: 'TWILIGHT DUSK',
        topColor: '#E8D4CC',
        midColor: '#2C5F8A',
        bottomColor: '#13283D',
        accentColor: '#F5E6E1', 
        backdrop: `
          radial-gradient(circle at 30% 0%, rgba(245, 230, 225, 0.4) 0%, transparent 60%),
          linear-gradient(165deg, #E8D4CC 0%, #2C5F8A 45%, #13283D 100%)
        `,
        soundType: 'lowPass',
        soundVol: 0.20
      },
      {
        id: 'night',
        name: 'ETHEREAL NIGHT',
        topColor: '#4A6278',
        midColor: '#1E3247',
        bottomColor: '#09131C',
        accentColor: '#95B3D4',
        backdrop: `
          radial-gradient(circle at 30% 0%, rgba(149, 179, 212, 0.3) 0%, transparent 60%),
          linear-gradient(165deg, #4A6278 0%, #1E3247 45%, #09131C 100%)
        `,
        soundType: 'pureNoise',
        soundVol: 0.15
      }
    ];

    let currentPhaseIndex = 2; // DUSK
    let selectedColor = '#2C5F8A';
    let historyList = [];

    const canvas = document.getElementById('colorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const artworkBox = document.getElementById('artworkBox');
    const reticle = document.getElementById('reticle');
    const backdrop = document.getElementById('backdrop');
    const phaseTitle = document.getElementById('phaseTitle');
    const hexReadout = document.getElementById('hexReadout');
    const generateBtn = document.getElementById('generateBtn');
    const prevPhaseBtn = document.getElementById('prevPhaseBtn');
    const nextPhaseBtn = document.getElementById('nextPhaseBtn');
    const timeCycleBtn = document.getElementById('timeCycleBtn');
    const historyTrack = document.getElementById('historyTrack');
    const toast = document.getElementById('toast');
    const ambientToggleBtn = document.getElementById('ambientToggleBtn');

    function setupCanvas() {
      const rect = artworkBox.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      drawAtmosphere();
      updatePointer(rect.width * 0.5, rect.height * 0.5);
    }

    function drawAtmosphere() {
      const phase = PHASES[currentPhaseIndex];
      const w = canvas.width;
      const h = canvas.height;

      const baseGrad = ctx.createLinearGradient(0, 0, 0, h);
      baseGrad.addColorStop(0, phase.topColor);
      baseGrad.addColorStop(0.45, phase.midColor);
      baseGrad.addColorStop(1, phase.bottomColor);
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = 'screen';
      const glowGrad = ctx.createRadialGradient(w * 0.3, 0, 0, w * 0.3, 0, w * 0.85);
      glowGrad.addColorStop(0, phase.accentColor + '88');
      glowGrad.addColorStop(0.5, phase.accentColor + '22');
      glowGrad.addColorStop(1, phase.accentColor + '00');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, w, h);
      
      ctx.globalCompositeOperation = 'source-over';
    }

    function switchPhase(direction) {
      currentPhaseIndex = (currentPhaseIndex + direction + PHASES.length) % PHASES.length;
      const phase = PHASES[currentPhaseIndex];
      
      backdrop.style.background = phase.backdrop;
      phaseTitle.textContent = phase.name;
      drawAtmosphere();

      const rect = artworkBox.getBoundingClientRect();
      const rx = parseFloat(reticle.style.left) || rect.width / 2;
      const ry = parseFloat(reticle.style.top) || rect.height / 2;
      pickColorAt(rx, ry);

      updateAmbientSound();
    }

    function pickColorAt(clientX, clientY) {
      const rect = artworkBox.getBoundingClientRect();
      const x = Math.max(0, Math.min(clientX, rect.width));
      const y = Math.max(0, Math.min(clientY, rect.height));

      const dpr = window.devicePixelRatio || 1;
      const pixel = ctx.getImageData(x * dpr, y * dpr, 1, 1).data;
      const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);

      selectedColor = hex;
      updatePointer(x, y);

      const luminance = (pixel[0] * 0.299 + pixel[1] * 0.587 + pixel[2] * 0.114) / 255;
      const clarity = (luminance * 100).toFixed(1);

      hexReadout.textContent = `HEX: ${hex.toUpperCase()} · CLARITY: ${clarity}%`;
    }

    function updatePointer(x, y) {
      reticle.style.left = `${x}px`;
      reticle.style.top = `${y}px`;
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    let isInteracting = false;
    function handleTouch(e) {
      if (e.target === ambientToggleBtn || ambientToggleBtn.contains(e.target)) return;
      const rect = artworkBox.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      pickColorAt(touch.clientX - rect.left, touch.clientY - rect.top);
    }

    artworkBox.addEventListener('pointerdown', (e) => {
      if (e.target === ambientToggleBtn || ambientToggleBtn.contains(e.target)) return;
      isInteracting = true;
      handleTouch(e);
    });
    window.addEventListener('pointermove', (e) => {
      if (isInteracting) handleTouch(e);
    });
    window.addEventListener('pointerup', () => { isInteracting = false; });
    window.addEventListener('pointercancel', () => { isInteracting = false; });

    function generateWallpaper() {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = 1080;
      offCanvas.height = 2340;
      const offCtx = offCanvas.getContext('2d');

      const grad = offCtx.createLinearGradient(0, 0, 0, 2340);
      grad.addColorStop(0, selectedColor);
      grad.addColorStop(0.35, selectedColor);
      grad.addColorStop(1, '#F6F8FA');

      offCtx.fillStyle = grad;
      offCtx.fillRect(0, 0, 1080, 2340);

      const link = document.createElement('a');
      link.download = `almost-transparent-blue-${Date.now()}.png`;
      link.href = offCanvas.toDataURL('image/png');
      link.click();

      pushHistory(selectedColor);
      showToast('壁紙をダウンロードしました');
    }

    function pushHistory(color) {
      historyList.unshift(color);
      if (historyList.length > 10) historyList.pop();
      try {
        localStorage.setItem('blue_history', JSON.stringify(historyList));
      } catch (e) {}
      renderHistory();
    }

    function renderHistory() {
      historyTrack.innerHTML = '';
      historyList.forEach((col, idx) => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.title = `Saved Drop #${idx + 1}`;

        const c = document.createElement('canvas');
        c.width = 54;
        c.height = 96;
        const cx = c.getContext('2d');
        const g = cx.createLinearGradient(0, 0, 0, 96);
        g.addColorStop(0, col);
        g.addColorStop(1, '#F6F8FA');
        cx.fillStyle = g;
        cx.fillRect(0, 0, 54, 96);

        card.appendChild(c);
        card.onclick = () => {
          selectedColor = col;
          hexReadout.textContent = `HEX: ${col.toUpperCase()} (RESTORED)`;
          showToast('履歴から色を復元しました');
        };
        historyTrack.appendChild(card);
      });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    prevPhaseBtn.addEventListener('click', () => switchPhase(-1));
    nextPhaseBtn.addEventListener('click', () => switchPhase(1));
    timeCycleBtn.addEventListener('click', () => switchPhase(1));
    generateBtn.addEventListener('click', generateWallpaper);

    window.addEventListener('load', () => {
      try {
        const saved = localStorage.getItem('blue_history');
        if (saved) historyList = JSON.parse(saved);
      } catch (e) {}
      if (!historyList.length) {
        historyList = ['#2C5F8A', '#3681B3', '#5C8BA6'];
      }
      renderHistory();
      
      backdrop.style.background = PHASES[currentPhaseIndex].backdrop;
      setupCanvas();
    });

    window.addEventListener('resize', setupCanvas);

    /* ==============================================================
       アンビエント環境音（iOS Safariの自動再生制限を突破する完全同期処理）
       ============================================================== */
    let audioContext = null;
    let whiteNoiseSource = null;
    let filterNode = null;
    let gainNode = null;
    let isPlaying = false;
    let isAudioUnlocked = false; // iOS用アンロックフラグ

    ambientToggleBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
    });

    // iOS/Safari では非同期(async/await)を挟むとブロックされるため、
    // click / touchend イベントの同期的コールバック内で直接生成とresumeを呼ぶ
    ambientToggleBtn.addEventListener('touchend', (e) => {
      e.stopPropagation();
      e.preventDefault(); // clickの二重発火防止
      handleAudioToggle();
    }, { passive: false });

    ambientToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleAudioToggle();
    });

    function handleAudioToggle() {
      // 1. 同期的にAudioContextを初期化
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
        setupAudioNodes();
      }

      // 2. iOS用 Silent Play Hack (最初の1回のみ無音を強制再生してパイプラインを開通させる)
      if (!isAudioUnlocked) {
        const osc = audioContext.createOscillator();
        const silentGain = audioContext.createGain();
        silentGain.gain.value = 0;
        osc.connect(silentGain);
        silentGain.connect(audioContext.destination);
        osc.start(0);
        osc.stop(audioContext.currentTime + 0.01);
        isAudioUnlocked = true;
      }

      // 3. suspended状態なら同期的にresumeする
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      // 4. 音量のフェード処理
      const now = audioContext.currentTime;
      const targetVol = PHASES[currentPhaseIndex].soundVol;

      if (!isPlaying) {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(targetVol, now + 0.1);

        ambientToggleBtn.classList.add('playing');
        isPlaying = true;
        showToast('アンビエント環境音を再生中');
      } else {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(0.0001, now + 0.1);

        ambientToggleBtn.classList.remove('playing');
        isPlaying = false;
        showToast('環境音をミュートしました');
      }
    }

    function setupAudioNodes() {
      const bufferSize = audioContext.sampleRate * 2;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      whiteNoiseSource = audioContext.createBufferSource();
      whiteNoiseSource.buffer = noiseBuffer;
      whiteNoiseSource.loop = true;

      filterNode = audioContext.createBiquadFilter();

      gainNode = audioContext.createGain();
      gainNode.gain.setValueAtTime(0.0001, audioContext.currentTime);

      whiteNoiseSource.connect(filterNode);
      filterNode.connect(gainNode);
      gainNode.connect(audioContext.destination);

      whiteNoiseSource.start(0);
      updateAmbientSound();
    }

    function updateAmbientSound() {
      if (!filterNode || !audioContext) return;
      const phase = PHASES[currentPhaseIndex];
      const now = audioContext.currentTime;

      filterNode.frequency.cancelScheduledValues(now);
      filterNode.Q.cancelScheduledValues(now);

      switch (phase.soundType) {
        case 'highPass':
          filterNode.type = 'highpass';
          filterNode.frequency.setTargetAtTime(1000, now, 0.3);
          filterNode.Q.setTargetAtTime(1, now, 0.3);
          break;
        case 'bandPass':
          filterNode.type = 'bandpass';
          filterNode.frequency.setTargetAtTime(750, now, 0.3);
          filterNode.Q.setTargetAtTime(1.2, now, 0.3);
          break;
        case 'lowPass':
          filterNode.type = 'lowpass';
          filterNode.frequency.setTargetAtTime(450, now, 0.3);
          filterNode.Q.setTargetAtTime(1, now, 0.3);
          break;
        case 'pureNoise':
        default:
          filterNode.type = 'lowpass';
          filterNode.frequency.setTargetAtTime(2500, now, 0.3);
          filterNode.Q.setTargetAtTime(0.7, now, 0.3);
          break;
      }

      if (isPlaying) {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(phase.soundVol, now + 0.2);
      }
    }
  </script>
</body>
